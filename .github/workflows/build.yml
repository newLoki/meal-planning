name: Build & deploy recipe site

on:
  push:
    branches: [main]
    paths:
      - "plans/**"
      - "templates/**"
      - "render.py"
      - "requirements.txt"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two Pages deployments at once.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Render site
        run: python render.py
        env:
          # Optional: only needed if you use a custom domain (CNAME).
          # Otherwise the base URL is derived from the repo automatically.
          PAGES_BASE_URL: ${{ vars.PAGES_BASE_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
